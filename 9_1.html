<html>
<head>
<style>
.table{
	border-style: solid;
	padding:5px;
	width: 505px;
	height: 325px;
}
.head1{
width:200px;height:30px;
border-style:solid;
position:relative;left:0px;top:0px;
padding: 10px;
}
.head2{
width:110px;height:30px;
border-style:solid;
position:relative;left:230px;top:-55px;
padding: 10px;
}
.head3{
width:110px;height:30px;
border-style:solid;
position:relative;left:370px;top:-110px;
padding: 10px;
}
.blue1 {width:200px;height:240px;background-color:blue;
border-style:solid;
position:relative;left:0px;top:-105px;
padding: 10px;}
.yellow1 {width:110px;height:30px;background-color:yellow;
border-style:solid;
position:relative;left:230px;top:-370px;
vertical-align: middle;
text-align: right;
padding: 10px;}
.red1 {width:110px;height:30px;background-color:red;
border-style:solid;
position:relative;left:370px;top:-425px;
text-align: center;
padding: 10px;}
.green1 {width:250px;height:180px;background-color:green;
border-style:solid;
position:relative;left:230px;top:-420px;
padding: 10px;}
</style>
</head>
<body>
	<div class="table">
	<div class="head1">
		<b>Column 1</b>
	</div>
	<div class="head2">
		<b>Column 2</b>
	</div>
	<div class="head3">
		<b>Column 3</b>
	</div class="head">
	<div class="blue1">
		<caption>An Numbered List</caption>
		<ol type="1">
			<li>Able</li>
			<li>Baker</li>
			<li>Charlie</li>
			<li>Delta</li>
			<li>Echo</li>
		</ol>	
	</div>
	<div class="yellow1">
	B
	</div>
	<div class="red1">
	C
	</div>
	<div class="green1">
	<caption>An Unnumbered List</caption>
	<ul type="">
		<li>Pounds</li>
		<li>Dollars</li>
		<li>Euro</li>
		<li>Yen</li>
		<li>Roubles</li>
	</ul>	
</div>
</div>
</body>
</html>
